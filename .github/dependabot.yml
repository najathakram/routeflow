# Dependabot: weekly dependency PRs, grouped to keep noise low.
# The monorepo uses npm workspaces with a single root lockfile, so one npm
# entry at "/" covers every workspace. Security updates always open
# individually regardless of grouping.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors need a deliberate migration (Prisma, Nest, Next, Expo pin their
      # ecosystems) — surface them but never auto-PR a major bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The jest toolchain is pinned as a set by root package.json `overrides`
      # (30.2.0). Bumping only the workspace manifests (PR #479) mixes jest
      # generations in one tree — jest-runtime 30.4+ calls jest-mock APIs the
      # pinned 30.2.0 lacks (clearMocksOnScope TypeError, every suite dies).
      # Jest moves ONLY via a deliberate whole-family bump of the overrides
      # block (see the npm-ci-migration task).
      - dependency-name: "jest"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "babel-jest"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Expo SDK 55 pins the native-module set (react-native 0.83.x, reanimated
      # 4.2.x, worklets 0.7.x, screens 4.2x, ...). Their "minor" bumps are
      # breaking (RN 0.x minors ARE majors) and broke typecheck on PR #463 —
      # these move only with a deliberate Expo SDK upgrade. Patches stay open.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-maps"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-svg"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # sanitize-html >= 2.17.6 swapped in an ESM-only htmlparser2 12 and
      # requires Node >= 22.12 (Jest can't load it; prod containers run
      # node:20). Pinned at 2.17.5 in apps/api — unpin both this ignore and
      # the pin when the platform moves to Node 22. The 2.17.6/2.17.7 security
      # fixes don't affect us (they need allowed svg/math/animation tags; we
      # sanitize with allowedTags: [], allowedAttributes: {}).
      - dependency-name: "sanitize-html"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # react-test-renderer must move in LOCKSTEP with apps/mobile's `react`, which
      # is pinned exact to Expo SDK 55's bundledNativeModules (react 19.2.0). PR
      # #546 offered rtr 19.2.8, whose peer is `react: ^19.2.8` — unsatisfiable
      # without moving react off the SDK pin, so npm resolves it by forking a
      # SECOND nested copy under jest-expo: two renderers against one React, and
      # the lock-edge validator's peer count goes 4 -> 5. Neither gate can fail on
      # it (the validator reports peers without erroring, and `npm ci` installs the
      # lock verbatim without re-resolving peers), so it would land silently.
      # ⚠️ Do NOT drop this ignore or the pin as "redundant" — @testing-library/
      # react-native carries its own react-test-renderer peer. Unpin only as part
      # of an Expo SDK upgrade that moves `react`, and bump both together.
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Ungrouped, this ecosystem opened one individual PR per bumped action —
      # each one its own `verify` run. One group == one PR per week for the
      # whole ecosystem, same shape as the npm "minor-and-patch" group above.
      actions-all:
        patterns:
          - "*"

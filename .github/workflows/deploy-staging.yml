# ─── Deploy to Staging ──────────────────────────────────────────────────────────
# Triggered on push to develop after CI passes.
# Builds Docker images, pushes to GHCR, and deploys to Railway staging.
# ────────────────────────────────────────────────────────────────────────────────

name: Deploy Staging

on:
  push:
    # DISABLED: `develop` does not exist in this repo, so this never fires. Kept
    # dormant deliberately — it runs `railway up` + `prisma migrate deploy`, and
    # this repo applies prod/staging migrations MANUALLY (see deploy-production.yml).
    branches: [__disabled_develop__]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web

permissions:
  contents: read
  packages: write

jobs:
  # ─── Wait for CI ───────────────────────────────────────────────────────────────
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ─── Build & Push Docker Images ────────────────────────────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            image_env: API_IMAGE
          - app: web
            dockerfile: apps/web/Dockerfile
            image_env: WEB_IMAGE

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env[matrix.image_env] }}:staging
            ${{ env[matrix.image_env] }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ─── Deploy to Railway Staging ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-images
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service api --environment staging --detach

      - name: Run database migrations
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --service api --environment staging -- npx prisma migrate deploy

      - name: Deploy Web to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service web --environment staging --detach

      - name: Verify deployments are healthy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Waiting for services to stabilise..."
          sleep 30
          railway status --environment staging

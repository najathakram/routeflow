# ─── Deploy to Production (DISABLED — manual dispatch only) ─────────────────────
# ⚠️ DO NOT re-enable the push trigger. This workflow is superseded by Railway's
# own GitHub auto-deploy, which redeploys api+web on every push to master.
#
# It used to trigger on `main` — a branch that no longer exists after the rename
# to `master`, so it has been silently dormant. Pointing it at `master` would:
#   1. race Railway's auto-deploy with a second `railway up` of the same commit, and
#   2. run `prisma migrate deploy` automatically on every deploy — which this repo
#      explicitly forbids (CLAUDE.md: prod schema changes are applied MANUALLY via
#      `railway run --service postgres node apps/api/scripts/prod-migrate.mjs`,
#      BEFORE the merge; the Docker CMD is `node dist/main.js` only, never a migration).
#
# Left here as a reference implementation for a future self-hosted/registry-based
# pipeline. Runnable on demand only, and only by someone who has read the above.
# ────────────────────────────────────────────────────────────────────────────────

name: Deploy Production (disabled)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a production deploy mid-flight

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web

permissions:
  contents: read
  packages: write

jobs:
  # ─── Wait for CI ───────────────────────────────────────────────────────────────
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ─── Build & Push Docker Images ────────────────────────────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            image_env: API_IMAGE
          - app: web
            dockerfile: apps/web/Dockerfile
            image_env: WEB_IMAGE

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env[matrix.image_env] }}:latest
            ${{ env[matrix.image_env] }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ─── Manual Approval Gate ──────────────────────────────────────────────────────
  # The "production" environment must have required reviewers configured in GitHub
  # Settings → Environments. The deploy job will pause here until approved.

  deploy:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    needs: build-images
    environment: production # ← requires manual approval from reviewers

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          railway up --service api --environment production --detach

      - name: Run database migrations
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          railway run --service api --environment production -- npx prisma migrate deploy

      - name: Deploy Web to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          railway up --service web --environment production --detach

      - name: Verify deployments are healthy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          echo "Waiting for services to stabilise..."
          sleep 30
          railway status --environment production

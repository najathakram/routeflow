# ─── Continuous Integration ─────────────────────────────────────────────────────
# Runs lint, type-check, and tests on every push and pull request to main.
#
# $0 Actions budget: GitHub Actions minutes are only free on PUBLIC repos. The
# flow to run CI on a normally-private repo is: make the repo public → push /
# open the PR → wait for this workflow to go green → make it private again.
#
# Local fast gates (no Actions minutes spent):
#   • pre-push hook    → `npm run check-types` + trunk-push block (.husky/pre-push)
#   • `npm run verify` → check-types + lint + test (the fuller pre-push check)
#   • `npm run smoke`  → liveness probe vs a running API (SMOKE_BASE_URL=… post-deploy)
# The Test job below already runs the api + mobile Jest suites (incl. the
# money-math / qty / backsync regression specs) via `turbo run test`.
# ────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Next.js has @next/swc-win32-* as optional deps; npm in workspaces
      # incorrectly fails on platform mismatch. Delete lockfile + --force.
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --force

      - run: npm run lint

  # ─── Type Check ────────────────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --force

      # Prisma client must be generated before tsc can resolve @prisma/client types
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - run: npm run check-types

  # ─── Test ──────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: routeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d routeflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/routeflow_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --force

      # Generate Prisma client and push schema to the test database
      - name: Setup database
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run tests
        run: npm run test -- -- --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/api/coverage/
            apps/web/coverage/
          retention-days: 14

  # ─── Playwright E2E ────────────────────────────────────────────────────────
  # Only runs on master push (where Railway deploys from) and manual dispatch.
  # Waits for API health before running so the deploy has time to stabilise.
  # Secrets needed: SMOKE_BASE_URL (API), PLAYWRIGHT_BASE_URL (web), PLAYWRIGHT_TENANT_SLUG
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --force

      # Wait for Railway to finish deploying (~2-4 min) before hitting the live app.
      - name: Wait for API health
        run: |
          API="${{ secrets.SMOKE_BASE_URL || 'https://routeflowapi-production.up.railway.app' }}"
          echo "Waiting for $API/api/v1/health …"
          for i in $(seq 1 30); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$API/api/v1/health" 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && echo "API healthy" && exit 0
            echo "  attempt $i/30: status $STATUS"
            sleep 10
          done
          echo "API did not become healthy after 5 minutes" && exit 1

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: apps/web
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://routeflowweb-production.up.railway.app' }}
          PLAYWRIGHT_TENANT_SLUG: ${{ secrets.PLAYWRIGHT_TENANT_SLUG || 'e2e-routeflow' }}
          # Super-admin specs skip when these secrets are absent (never hardcoded).
          PLAYWRIGHT_SA_USERNAME: ${{ secrets.PLAYWRIGHT_SA_USERNAME }}
          PLAYWRIGHT_SA_PASSWORD: ${{ secrets.PLAYWRIGHT_SA_PASSWORD }}
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci-${{ github.run_number }}
          path: apps/web/playwright-report/
          retention-days: 7

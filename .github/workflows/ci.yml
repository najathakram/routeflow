# ─── Continuous Integration ─────────────────────────────────────────────────────
# Runs lint, type-check, and tests on every push and pull request to main.
#
# $0 Actions budget: Actions minutes are unlimited on PUBLIC repos; a private repo
# draws on the account's monthly free-minute allowance and then bills.
#
# NOTE (2026-07-30): the repo NO LONGER needs a public/private flip to DEPLOY —
# Railway's GitHub App has private-repo access and redeploys master while private
# (verified on PR #313). The flip only ever bought free CI minutes, so with the
# repo private this workflow runs only if the account's Actions billing is healthy.
# When it is blocked, every job fails in ~10s with 0 steps and the annotation
# "The job was not started because recent account payments have failed…" — that is
# a billing state, NOT a code failure. THE LOCAL GATE IS AUTHORITATIVE in that case.
#
# Triggers are deliberately narrow to conserve minutes: trunk pushes + PRs into
# master only. (Until 2026-07-30 this ran on `push: ["**"]` — every branch push —
# while `pull_request` pointed at the non-existent `main`, so PR checks never ran.)
#
# Local gates (no Actions minutes spent):
#   • pre-push hook    → `npm run verify` + trunk-push block (.husky/pre-push)
#   • `npm run verify` → check-types + lint + test (turbo-cached, so repeat runs are fast)
#   • `npm run smoke`  → liveness probe vs a running API (SMOKE_BASE_URL=… post-deploy)
# The Test job below already runs the api + mobile Jest suites (incl. the
# money-math / qty / backsync regression specs) via `turbo run test`.
# ────────────────────────────────────────────────────────────────────────────────

name: CI

# NOTE: the lists below are duplicated on purpose — the GitHub Actions workflow
# parser does not support YAML anchors/aliases, so `&x` / `*x` would not work here.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  # Manual trigger — lets you confirm CI is healthy (e.g. after an Actions billing
  # block clears) without having to push a dummy commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─── Lockfile integrity ────────────────────────────────────────────────────────
  # npm's arborist ACCEPTS package-lock trees with unresolvable dependency edges:
  # `npm ci` installs them without complaint and the breakage surfaces only when
  # something lazily requires the absent module (found on #488 — @jest/reporters'
  # istanbul deps and jest-changed-files' execa were missing from the tree; jest
  # ran fine and `--coverage` crashed). Needs nothing but Node and the lockfile,
  # so it runs BEFORE any install — there is no point installing a holed tree.
  #
  # This job MUST run the full gate, not just reachability, and that is why it
  # installs semver first. An incoherent override makes `npm ci` itself fail —
  # verified: mobile declaring jest ^30.3.0 against the 30.2.0 pin produces
  # "Missing: jest@30.5.0 / @jest/core@30.5.0 / camelcase@6.3.0 …", the phantom
  # subtree, naming everything except the cause. So every job that installs dies
  # at install, and a post-install gate would never run on precisely the case it
  # exists to explain. Pre-install is the only placement that survives it.
  #
  # semver is pinned to the version the repo's own tree hoists, so this job and
  # `npm run verify` (which reads semver from node_modules) cannot reach
  # different verdicts on the same lockfile. Bump the two together — the
  # validator prints the version it used so a divergence is visible.
  lock-integrity:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Into a SCRATCH dir, never the repo root: `npm install <pkg>` at a
      # workspaces root re-resolves the whole workspace tree from the registry
      # (measured: over 10 minutes without finishing) — the exact behaviour #488
      # removed. An empty directory adds one package, and NODE_PATH makes it
      # resolvable, the same mechanism apps/mobile/Dockerfile uses.
      - name: Fetch semver (isolated — deliberately not a workspace install)
        run: |
          mkdir -p "$RUNNER_TEMP/lockdeps"
          cd "$RUNNER_TEMP/lockdeps"
          npm install --no-save --no-audit --no-fund --ignore-scripts semver@6.3.1

      - name: Validate lockfile dependency edges
        run: npm run validate-lock
        env:
          NODE_PATH: ${{ runner.temp }}/lockdeps/node_modules

  # ─── Bug-signature scan ────────────────────────────────────────────────────────
  # Greps for the code shapes that have historically BEEN bugs here (dead hooks,
  # confirm-then-navigate, money re-derivation, swallowed writes…). The existing
  # backlog is baselined in .claude/skills/bug-hunt/scan-ignore.json, so this only
  # fails on NEWLY introduced instances. Zero deps, no install, ~2s.
  # On failure: fix it, or add `// scan-ok: <id> — <reason>` above the line.
  bug-scan:
    name: Bug Signature Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: node .claude/skills/bug-hunt/scripts/scan-signatures.mjs

  # ─── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` installs exactly the committed lockfile — no registry
      # re-resolution. (The old `rm lockfile + npm install --force` recipe made
      # every CI run re-resolve the world; standardwebhooks@1.1.0 shipping a
      # broken dist-less tarball broke CI within hours despite a pinned lock.)
      #
      # --engine-strict=false: the root .npmrc sets engine-strict=true, but that
      # gate was dead everywhere before this migration (--force overrode it in
      # CI; the Dockerfiles never COPY .npmrc) — and prisma 7.10's dev-only
      # transitive @prisma/streams-local declares engines node>=22 while this
      # runtime (and prod's node:20-alpine images) is Node 20. Keep the old
      # warn-don't-block behavior; revisit when the prod images move to 22.
      - name: Install dependencies
        run: npm ci --engine-strict=false

      # No lockfile check here: the lock-integrity job above already runs the
      # full gate, and does it pre-install where it still runs even when an
      # incoherent lock makes `npm ci` fail. One artifact, all gates.
      - run: npm run lint

  # ─── Type Check ────────────────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict=false

      # Prisma client must be generated before tsc can resolve @prisma/client types
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - run: npm run check-types

  # ─── Test ──────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: routeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d routeflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/routeflow_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict=false

      # Replay the migration history against a FRESH Postgres before anything
      # else. `db push` below applies the schema directly and so has never
      # exercised the migration files at all — which is exactly how a broken
      # migration reaches production, where the only way to apply schema is
      # `prisma migrate deploy`. This step fails the PR instead.
      - name: Verify migrations apply to a fresh database
        working-directory: apps/api
        run: npx prisma migrate deploy

      # Generate Prisma client and push schema to the test database
      - name: Setup database
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run tests
        run: npm run test -- -- --coverage

      - name: Upload coverage reports
        if: always()
        # Artifact-storage quota exhaustion must never fail the Test job — every
        # test already passed by this step. Quota recalculates every 6-12h.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            apps/api/coverage/
            apps/web/coverage/
          retention-days: 14

  # ─── Security Audit ────────────────────────────────────────────────────────
  # F12-001: fail CI on any CRITICAL production advisory, and surface (without
  # blocking on) highs. Kept non-blocking at the high level for now so every PR
  # isn't wedged on the two known SemVer-MAJOR fixes (next 14→16, nodemailer 9);
  # tighten to `--audit-level=high` once those majors are migrated.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict=false

      - name: Fail on critical production advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Report high-severity advisories (non-blocking)
        if: always()
        run: npm audit --omit=dev --audit-level=high || true

  # ─── Playwright E2E ────────────────────────────────────────────────────────
  # Only runs on master push (where Railway deploys from) and manual dispatch.
  # Blocks on a deploy-readiness gate that proves the DEPLOYED WEB build is the
  # commit these specs were checked out at — see the step's own comment for what
  # it does and does not prove. (Until 2026-08-29 the gate polled the API's
  # /health and nothing else, which answers 200 from the previous deploy: it
  # passed in one second on run 33263396288 and the suite then ran against a web
  # build that did not match the checkout.)
  # Secrets needed: SMOKE_BASE_URL (API), PLAYWRIGHT_BASE_URL (web), PLAYWRIGHT_TENANT_SLUG
  # Optional: E2E_SEED_DATABASE_URL — Postgres URL for the target deployment's DB.
  #   When set, global.setup re-seeds the `e2e-routeflow` tenant every run (and a
  #   seed failure FAILS the job); when absent, seeding is skipped with a notice
  #   and the standing tenant is assumed pre-seeded. Never point it at anything
  #   but the deployment the PLAYWRIGHT_BASE_URL app reads from.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # 45, not 25: the readiness gate below now actually waits for the Railway web
    # deploy (up to 15 min) instead of returning in a second, so the suite needs
    # its own budget on top of that.
    timeout-minutes: 45
    needs: [lint, type-check, test]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the readiness gate diffs the commit the deployed web
          # app reports against this one, and that commit is an ancestor the
          # default depth-1 clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict=false

      # ─── Deploy-readiness gate ───────────────────────────────────────────────
      # Every spec below runs against the DEPLOYED web app, so the gate has to
      # prove the deployed WEB build is the code this checkout asserts on.
      #
      # WHAT THIS PROVES, using apps/web/app/api/health's `sha` (Railway injects
      # RAILWAY_GIT_COMMIT_SHA into the running container):
      #   1. the API answers 200, and
      #   2. the web app answers 200, and
      #   3. the deployed web build is code-identical to github.sha for web's
      #      OWN build inputs.
      #
      # (3) is deliberately NOT `sha == github.sha`. Railway deploys per service
      # via watchPatterns (web = apps/web/** + packages/**), so an api-only push
      # legitimately leaves the web service on an older commit and never
      # redeploys it — demanding an exact match would turn every api-only master
      # push into a false red. An older web SHA therefore passes ONLY when
      # nothing under apps/web/ or packages/ differs between it and github.sha.
      # Anything else — stale web build, still-building deploy, failed deploy,
      # or a web app AHEAD of the checkout (the run-33263396288 case) — keeps
      # waiting and then FAILS the job. It never silently continues.
      #
      # KNOWN LIMITATION, stated rather than papered over: the API is probed for
      # REACHABILITY ONLY. apps/api/src/app.service.ts returns {status,timestamp}
      # and exposes no commit SHA, so an api-only deploy still in flight is NOT
      # detected here and a spec depending on new API behaviour can still race.
      # Closing that gap means adding the same field to the API health payload.
      - name: Wait for the deployed app to match this commit
        env:
          API_BASE: ${{ secrets.SMOKE_BASE_URL || 'https://routeflowapi-production.up.railway.app' }}
          WEB_BASE: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://routeflowweb-production.up.railway.app' }}
          EXPECTED_SHA: ${{ github.sha }}
          # The SHA match is only meaningful on master — see the guard below.
          REQUIRE_SHA: ${{ github.ref == 'refs/heads/master' }}
          # 15 min. A cold web image (npm ci + next build in Docker) runs ~5-9
          # min, and on a packages/** push the web service queues behind the api.
          WAIT_SECONDS: "900"
        run: |
          set -uo pipefail

          # workflow_dispatch is offered from ANY branch in the GitHub UI. Off
          # master, github.sha is a commit Railway has never deployed and never
          # will, so the SHA match below could never succeed: the gate would burn
          # its whole 15-minute budget and then fail. That would turn this file's
          # own documented recovery path ("re-dispatch after the Railway deploy
          # shows SUCCESS") into a footgun for anyone who dispatches from the
          # branch they were working on. So off master, fall back to the old
          # reachability-only wait and say plainly that freshness is NOT proven.
          # Probes the web ROOT here, not /api/health, so this path keeps working
          # against a deployment predating that route.
          if [ "$REQUIRE_SHA" != "true" ]; then
            echo "::notice::Ref ${GITHUB_REF:-unknown} is not master — running the reachability-only wait. Deploy freshness is NOT proven: the deployed app is master, these specs are not."
            for i in $(seq 1 30); do
              # `-w` already prints 000 on failure; `|| echo 000` would double it.
              a=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$API_BASE/api/v1/health") || true
              w=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$WEB_BASE/") || true
              a=${a:-000}
              w=${w:-000}
              if [ "$a" = "200" ] && [ "$w" = "200" ]; then
                echo "api and web both reachable (freshness unchecked)."
                exit 0
              fi
              echo "  attempt $i/30: api=$a web=$w"
              sleep 10
            done
            echo "::error::api/web did not become reachable within 5 minutes."
            exit 1
          fi

          echo "Expecting the deployed web app to be $EXPECTED_SHA"
          # Outside the checkout on purpose - nothing this step writes should
          # end up as an untracked file in the tree Playwright then runs from.
          probe="${RUNNER_TEMP:-/tmp}/web-health.json"
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          attempt=0
          api_ok=0
          web_status="none"
          web_sha=""
          drift=""

          while :; do
            attempt=$(( attempt + 1 ))
            # Reset per iteration: otherwise a later poll that sees web=404/000
            # still prints the PREVIOUS iteration's file list in the timeout
            # report, which reads as a contradiction next to "sha=none".
            drift=""

            if [ "$api_ok" -eq 0 ]; then
              # `curl -w` already emits 000 on a connection failure, so a
              # `|| echo 000` would APPEND a second one and log "000000".
              api_status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                "$API_BASE/api/v1/health") || true
              api_status=${api_status:-000}
              if [ "$api_status" = "200" ]; then
                api_ok=1
                echo "api : 200 (reachable; freshness NOT proven — see step comment)"
              else
                echo "api : $api_status"
              fi
            fi

            web_status=$(curl -s -o "$probe" -w '%{http_code}' --max-time 15 \
              -H 'cache-control: no-cache' "$WEB_BASE/api/health") || true
            web_status=${web_status:-000}
            web_sha=""
            if [ "$web_status" = "200" ]; then
              # node, not jq: setup-node already ran, so node is guaranteed here,
              # whereas jq is only a convention of the runner image. A missing
              # parser would read as "no sha" and time the gate out for the wrong
              # reason. Prints nothing when sha is absent/null/not a string.
              web_sha=$(node -e 'try{const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(typeof d.sha==="string")process.stdout.write(d.sha)}catch(e){}' "$probe" || true)
            fi

            if [ "$api_ok" -eq 1 ] && [ -n "$web_sha" ]; then
              if [ "$web_sha" = "$EXPECTED_SHA" ]; then
                echo "web : 200, serving $web_sha - exactly the commit under test."
                echo "Deploy readiness CONFIRMED after $attempt attempt(s)."
                exit 0
              fi
              if drift=$(git diff --name-only "$web_sha" "$EXPECTED_SHA" -- apps/web packages 2>/dev/null); then
                if [ -z "$drift" ]; then
                  echo "web : 200, serving $web_sha (not $EXPECTED_SHA), but nothing under"
                  echo "      apps/web/ or packages/ differs between them - Railway correctly"
                  echo "      SKIPPED the web service for this push."
                  echo "Deploy readiness CONFIRMED after $attempt attempt(s)."
                  exit 0
                fi
                echo "web : 200, serving $web_sha - does not match ($(printf '%s\n' "$drift" | wc -l) web file(s) differ)."
              else
                drift="__unresolved__"
                echo "web : 200, serving $web_sha - that commit is not in this checkout."
              fi
            elif [ "$web_status" = "200" ] && [ -n "$web_sha" ]; then
              echo "web : 200, serving $web_sha - holding for the API probe."
            elif [ "$web_status" = "200" ]; then
              echo "web : 200 but /api/health carried no \"sha\" - route missing from the"
              echo "      deployed build, or RAILWAY_GIT_COMMIT_SHA unset in the container."
            else
              echo "web : $web_status"
            fi

            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              break
            fi
            echo "  attempt $attempt - retrying in 10s ($(( deadline - now ))s of budget left)"
            sleep 10
          done

          echo "::error::Deploy-readiness gate TIMED OUT after ${WAIT_SECONDS}s - refusing to run E2E against a deployment that is not this commit."
          echo "  expected commit  : $EXPECTED_SHA"
          if [ "$api_ok" -eq 1 ]; then
            echo "  api /health      : 200"
          else
            echo "  api /health      : never returned 200"
          fi
          echo "  web /api/health  : status=$web_status sha=${web_sha:-none}"
          if [ "$drift" = "__unresolved__" ]; then
            echo "  The SHA the web app reports is not in this checkout - a 'railway up'"
            echo "  force-deploy, or a rewritten history."
          elif [ -n "$drift" ]; then
            echo "  Web files differing between the deployed build and this commit:"
            printf '%s\n' "$drift" | head -40 | sed 's/^/    /'
          fi
          echo "  Most likely the Railway web deploy failed or is still building. Fix or"
          echo "  re-run the deploy, then re-dispatch this workflow."
          echo "  (Only master reaches this branch — a dispatch from any other ref took"
          echo "  the reachability-only path far above and never gets here.)"
          exit 1

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: apps/web
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://routeflowweb-production.up.railway.app' }}
          PLAYWRIGHT_TENANT_SLUG: ${{ secrets.PLAYWRIGHT_TENANT_SLUG || 'e2e-routeflow' }}
          # Optional — see the job comment. Empty (secret absent) = seed skipped.
          E2E_SEED_DATABASE_URL: ${{ secrets.E2E_SEED_DATABASE_URL }}
          # Super-admin specs skip when these secrets are absent (never hardcoded).
          PLAYWRIGHT_SA_USERNAME: ${{ secrets.PLAYWRIGHT_SA_USERNAME }}
          PLAYWRIGHT_SA_PASSWORD: ${{ secrets.PLAYWRIGHT_SA_PASSWORD }}
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ci-${{ github.run_number }}
          path: apps/web/playwright-report/
          retention-days: 7

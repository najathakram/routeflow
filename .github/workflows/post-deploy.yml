# ─── Post-Deploy Verification ────────────────────────────────────────────────
# MANUAL / AD-HOC ONLY. This is the "go and check production right now" button:
# an authenticated API smoke followed by the full Playwright suite, against any
# API/web URL pair you give it.
#
# ⚠️ IT IS NOT THE AUTOMATIC POST-DEPLOY CHECK ANY MORE (2026-08-30).
# It used to carry `repository_dispatch: [railway-deploy]`, which never fired in
# 30 days. ci.yml's `e2e` job now runs on Railway's `deployment_status` and owns
# `railway-deploy` as its declared fallback. That trigger was REMOVED here rather
# than left in place, because two workflows accepting the same event would have
# meant two Playwright suites — ~11 billed minutes of duplicate — the first time
# anyone actually wired the webhook. Do not add it back without removing it from
# ci.yml first.
#
# ⚠️ MINUTES. This workflow is TWO jobs with TWO `npm ci`s (~11 billed min a run)
# against a 2,000 min/mo private allowance. That is fine for something a human
# triggers on purpose; it is why it is not on a schedule or a webhook. Read the
# budget block at the top of ci.yml before giving it an automatic trigger.
#
# Run it from the Actions tab → "Post-Deploy Verification" → "Run workflow", with
# optional URL overrides (defaults come from the same secrets ci.yml uses).
#
# Self-hosted runners have been considered and REJECTED for this repo — see the
# note in the CI-minutes analysis: a self-hosted runner on a box holding Railway
# credentials and live sessions is not a safe trade for minutes, and it would not
# help here anyway.
# ─────────────────────────────────────────────────────────────────────────────

name: Post-Deploy Verification

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API base URL to verify"
        required: false
        default: ""
      web_url:
        description: "Web base URL for Playwright"
        required: false
        default: ""
      wait_for_health:
        description: "Retry health check before running tests (seconds × 10)"
        required: false
        default: "30"

concurrency:
  group: post-deploy
  cancel-in-progress: true # a newer manual run supersedes an in-flight check

env:
  NODE_VERSION: "20"
  # Dispatch inputs, then the secrets ci.yml uses, then the public defaults. The
  # `github.event.client_payload.*` fallbacks that used to sit in the middle were
  # dropped with the repository_dispatch trigger — nothing can populate them now,
  # and leaving them in reads as if a webhook still feeds this workflow.
  API_URL: >-
    ${{
      inputs.api_url ||
      secrets.SMOKE_BASE_URL ||
      'https://routeflowapi-production.up.railway.app'
    }}
  WEB_URL: >-
    ${{
      inputs.web_url ||
      secrets.PLAYWRIGHT_BASE_URL ||
      'https://routeflowweb-production.up.railway.app'
    }}

jobs:
  # ─── Wait + Authenticated API smoke ──────────────────────────────────────────
  api-smoke:
    name: Wait → API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root deps
        run: npm ci --engine-strict=false

      - name: Run post-deploy check (waits for health first)
        run: npm run post-deploy-check
        env:
          SMOKE_BASE_URL: ${{ env.API_URL }}
          SMOKE_TENANT_SLUG: ${{ secrets.PLAYWRIGHT_TENANT_SLUG || 'e2e-routeflow' }}
          # Wait up to (SMOKE_WAIT_RETRIES × 10)s for the API to become healthy after deploy
          SMOKE_WAIT_RETRIES: ${{ inputs.wait_for_health || '30' }}

  # ─── Playwright E2E (runs after smoke passes) ────────────────────────────────
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: api-smoke
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict=false

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: apps/web
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.WEB_URL }}
          PLAYWRIGHT_TENANT_SLUG: ${{ secrets.PLAYWRIGHT_TENANT_SLUG || 'e2e-routeflow' }}
          # Super-admin specs skip when these secrets are absent (never hardcoded).
          PLAYWRIGHT_SA_USERNAME: ${{ secrets.PLAYWRIGHT_SA_USERNAME }}
          PLAYWRIGHT_SA_PASSWORD: ${{ secrets.PLAYWRIGHT_SA_PASSWORD }}
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-post-deploy-${{ github.run_number }}
          path: apps/web/playwright-report/
          retention-days: 7

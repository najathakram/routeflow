# ─── Nightly Regression ──────────────────────────────────────────────────────
# Runs every night at 02:00 UTC against the production Railway deployment.
# Also triggerable manually via "Run workflow" in the GitHub Actions UI.
#
# Jobs:
#   api-smoke   — authenticated post-deploy-check.mjs (login, list endpoints,
#                 float-artifact scan, invoice math assertion) followed by
#                 feature-smoke.mjs (write-path smoke of the 2026-08-20 batch)
#   playwright  — full Playwright e2e suite against the production web URL
#
# Required GitHub secrets:
#   SMOKE_BASE_URL        — API URL  (e.g. https://routeflowapi-production.up.railway.app)
#   PLAYWRIGHT_BASE_URL   — Web URL  (e.g. https://routeflowweb-production.up.railway.app)
#   PLAYWRIGHT_TENANT_SLUG — tenant slug for test logins (e.g. e2e-routeflow)
#
# ⚠️ THE SCHEDULE IS DISABLED — ON PURPOSE (2026-08-30). Dispatch only.
#
# This workflow has not actually executed since 2026-08-20: while Actions billing
# was blocked, every job failed to start in ~2s with 0 steps ("recent account
# payments have failed…"). That produced a nightly RED every night that meant
# nothing, and it is why a nightly conclusion must never be read without first
# confirming `steps > 0`.
#
# The reason the cron is now commented out rather than left to recover on its own
# is a budget one. A private repo draws on a metered allowance (GitHub Free:
# 2,000 min/mo), and this workflow costs roughly 11 billed minutes a night —
# api-smoke ~2 plus a full Playwright suite ~9 — so the moment billing is healthy
# it would quietly resume and take ~330 min/month, a sixth of the entire Free
# allowance, for a run nobody is currently reading. Turning it back on is a
# deliberate decision with a price tag, not a default.
#
# What actually covers this ground today: ci.yml's e2e job runs the same
# Playwright suite against the deployment after every master push, and
# `npm run regression` (verify + post-deploy-check + feature-smoke) runs locally.
# See docs/testing/verification-matrix.md.
#
# To re-enable: uncomment the `schedule:` block below and budget the ~330 min/mo.
# ─────────────────────────────────────────────────────────────────────────────

name: Nightly Regression

on:
  # schedule:
  #   - cron: "0 2 * * *" # 02:00 UTC every day — disabled, see the header note
  workflow_dispatch:
    inputs:
      api_url:
        description: "API base URL (overrides secret)"
        required: false
      web_url:
        description: "Web base URL (overrides secret)"
        required: false

concurrency:
  group: nightly
  cancel-in-progress: false # let a running nightly finish

env:
  NODE_VERSION: "20"
  API_URL: ${{ inputs.api_url || secrets.SMOKE_BASE_URL || 'https://routeflowapi-production.up.railway.app' }}
  WEB_URL: ${{ inputs.web_url || secrets.PLAYWRIGHT_BASE_URL || 'https://routeflowweb-production.up.railway.app' }}

jobs:
  # ─── Authenticated API smoke ─────────────────────────────────────────────────
  api-smoke:
    name: API smoke (authenticated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root deps
        run: npm ci --engine-strict=false

      - name: Run post-deploy check
        run: npm run post-deploy-check
        env:
          SMOKE_BASE_URL: ${{ env.API_URL }}
          SMOKE_TENANT_SLUG: ${{ secrets.PLAYWRIGHT_TENANT_SLUG || 'e2e-routeflow' }}
          SMOKE_WAIT_RETRIES: "0" # production is already running; no need to wait

      - name: Run feature smoke
        run: npm run feature-smoke
        env:
          SMOKE_BASE_URL: ${{ env.API_URL }}
          SMOKE_TENANT_SLUG: ${{ secrets.PLAYWRIGHT_TENANT_SLUG || 'e2e-routeflow' }}

  # ─── Playwright E2E ──────────────────────────────────────────────────────────
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict=false

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      # Deliberately NO deploy-readiness gate here, unlike ci.yml's e2e job.
      # That gate exists because the master-push job races the Railway deploy it
      # was triggered by. This one runs at 02:00 UTC on a schedule, hours after
      # any deploy, so there is nothing to wait for — and gating on github.sha
      # would be actively wrong: a scheduled run's sha is the branch tip, which
      # says nothing about when the deployment happened.
      # ⚠️ Separately: this workflow has not actually executed in weeks. While the
      # repo is private, scheduled Actions are billed and every job fails to start
      # ("recent account payments have failed…", started_at: null). Do not treat a
      # nightly result — green or red — as a signal without checking it ran.
      - name: Run Playwright tests
        working-directory: apps/web
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.WEB_URL }}
          PLAYWRIGHT_TENANT_SLUG: ${{ secrets.PLAYWRIGHT_TENANT_SLUG || 'e2e-routeflow' }}
          # Optional — when set, global.setup re-seeds `e2e-routeflow` (failure
          # fails the job); when absent, seeding skips with a notice and the
          # standing tenant is assumed pre-seeded. See ci.yml's e2e job comment.
          E2E_SEED_DATABASE_URL: ${{ secrets.E2E_SEED_DATABASE_URL }}
          # Super-admin specs skip when these secrets are absent (never hardcoded).
          PLAYWRIGHT_SA_USERNAME: ${{ secrets.PLAYWRIGHT_SA_USERNAME }}
          PLAYWRIGHT_SA_PASSWORD: ${{ secrets.PLAYWRIGHT_SA_PASSWORD }}
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-${{ github.run_number }}
          path: apps/web/playwright-report/
          retention-days: 14

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
# Railway builds from the repo root — the Dockerfile COPY context is "."
watchPatterns = ["apps/api/**", "packages/**"]

[deploy]
# Sync schema to DB (handles incomplete migrations on fresh DBs) then start
startCommand = "npx prisma db push --accept-data-loss; node dist/main.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

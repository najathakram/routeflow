[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
# Railway builds from the repo root — the Dockerfile COPY context is "."
# This file is itself under apps/api/**, so editing it retriggers a build.
watchPatterns = ["apps/api/**", "packages/**"]

[deploy]
startCommand = "npx prisma migrate deploy && node dist/main.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

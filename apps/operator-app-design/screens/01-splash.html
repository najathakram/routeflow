<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Splash</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;height:844px;overflow:hidden;font-family:-apple-system,"SF Pro Display","Inter",sans-serif;-webkit-font-smoothing:antialiased;}
.screen{width:390px;height:844px;background:linear-gradient(165deg,#0F2744 0%,#1B3A5C 45%,#0D2137 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}

/* Decorative circles */
.circle{position:absolute;border-radius:50%;opacity:0.08;}
.c1{width:400px;height:400px;background:#2563EB;top:-120px;right:-100px;}
.c2{width:300px;height:300px;background:#60A5FA;bottom:-80px;left:-80px;}
.c3{width:180px;height:180px;background:white;top:200px;right:-60px;opacity:0.04;}

/* Route lines decoration */
.route-lines{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.06;}

.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px;}

.logo-mark{
  width:80px;height:80px;
  background:linear-gradient(135deg,#3B82F6,#1D4ED8);
  border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:900;color:white;
  margin-bottom:24px;
  box-shadow:0 8px 32px rgba(37,99,235,0.5), 0 0 0 1px rgba(255,255,255,0.1);
}

.app-name{font-size:36px;font-weight:900;color:white;letter-spacing:-1px;margin-bottom:6px;}
.app-name span{color:#60A5FA;}
.app-sub{font-size:14px;color:rgba(255,255,255,0.5);letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:60px;}

/* Animated dots */
.dots{display:flex;gap:8px;margin-bottom:80px;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);}
.dot.active{background:white;width:24px;border-radius:4px;}

.tagline{font-size:22px;font-weight:700;color:white;line-height:1.35;margin-bottom:12px;letter-spacing:-0.3px;}
.tagline-sub{font-size:14px;color:rgba(255,255,255,0.55);line-height:1.6;max-width:280px;}

.bottom{position:absolute;bottom:48px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 32px;}
.btn-primary{
  width:100%;height:52px;
  background:linear-gradient(135deg,#3B82F6,#1D4ED8);
  border-radius:16px;border:none;
  color:white;font-size:16px;font-weight:700;
  cursor:pointer;letter-spacing:0.2px;
  box-shadow:0 4px 20px rgba(37,99,235,0.45);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-secondary{
  font-size:14px;color:rgba(255,255,255,0.5);font-weight:500;
}

/* Feature pills */
.features{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:32px;}
.feature-pill{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:999px;
  padding:6px 14px;
  font-size:12px;color:rgba(255,255,255,0.65);font-weight:500;
  display:flex;align-items:center;gap:6px;
}
</style>
</head>
<body>
<div class="screen">
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>

  <!-- SVG decorative route lines -->
  <svg class="route-lines" viewBox="0 0 390 844" fill="none">
    <path d="M0 300 Q100 250 200 350 Q300 450 390 380" stroke="white" stroke-width="1.5" fill="none"/>
    <path d="M0 500 Q80 480 160 520 Q240 560 390 500" stroke="white" stroke-width="1" fill="none"/>
    <circle cx="200" cy="350" r="6" fill="white" opacity="0.3"/>
    <circle cx="100" cy="260" r="4" fill="white" opacity="0.2"/>
    <circle cx="310" cy="390" r="5" fill="white" opacity="0.2"/>
  </svg>

  <div class="content">
    <div class="logo-mark">RF</div>
    <div class="app-name">Route<span>Flow</span></div>
    <div class="app-sub">Operator</div>

    <div class="tagline">Run your delivery<br/>business from anywhere</div>
    <div class="tagline-sub">Manage routes, drivers, customers and finances — all in your pocket.</div>

    <div class="features">
      <div class="feature-pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Live Routes
      </div>
      <div class="feature-pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Customers
      </div>
      <div class="feature-pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Invoices
      </div>
      <div class="feature-pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Analytics
      </div>
    </div>
  </div>

  <div class="bottom">
    <button class="btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Get Started
    </button>
    <div class="btn-secondary">Already have an account? Sign in</div>
  </div>
</div>
</body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{width:390px;height:844px;overflow:hidden;font-family:-apple-system,"SF Pro Display","Inter",sans-serif;-webkit-font-smoothing:antialiased;}
.screen{width:390px;height:844px;background:#F8FAFC;display:flex;flex-direction:column;overflow:hidden;}

.top-hero{
  background:linear-gradient(165deg,#0F2744 0%,#1B3A5C 100%);
  padding:56px 32px 40px;
  position:relative;overflow:hidden;
  flex-shrink:0;
}
.hero-circle{position:absolute;border-radius:50%;opacity:0.07;}
.hc1{width:250px;height:250px;background:#60A5FA;top:-80px;right:-60px;}
.hc2{width:150px;height:150px;background:white;bottom:-40px;left:-30px;}

.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:28px;position:relative;z-index:1;}
.logo-mark{width:42px;height:42px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:white;}
.logo-text{font-size:20px;font-weight:800;color:white;letter-spacing:-0.3px;}
.logo-text span{color:#60A5FA;}

.hero-title{font-size:26px;font-weight:800;color:white;letter-spacing:-0.5px;line-height:1.25;margin-bottom:8px;position:relative;z-index:1;}
.hero-sub{font-size:14px;color:rgba(255,255,255,0.55);position:relative;z-index:1;}

.form-area{flex:1;overflow-y:auto;padding:28px 24px;}

.input-group{margin-bottom:18px;}
.input-label{font-size:12px;font-weight:700;color:#1B3A5C;opacity:0.6;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px;display:block;}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-icon{position:absolute;left:14px;color:rgba(27,58,92,0.35);}
.input-field{
  width:100%;height:48px;
  border:1.5px solid #E2E8F0;border-radius:12px;
  padding:0 14px 0 42px;
  font-family:inherit;font-size:15px;color:#1B3A5C;
  background:white;outline:none;
  box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.input-field:focus{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
.input-field::placeholder{color:rgba(27,58,92,0.3);}
.input-right{position:absolute;right:14px;color:rgba(27,58,92,0.35);}

.forgot{text-align:right;margin-top:-10px;margin-bottom:20px;}
.forgot a{font-size:13px;color:#2563EB;font-weight:600;text-decoration:none;}

.btn-primary{
  width:100%;height:52px;
  background:linear-gradient(135deg,#2563EB,#1D4ED8);
  border-radius:14px;border:none;
  color:white;font-size:16px;font-weight:700;
  cursor:pointer;letter-spacing:0.2px;
  box-shadow:0 4px 20px rgba(37,99,235,0.35);
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:20px;
}

.divider-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.divider-line{flex:1;height:1px;background:#E2E8F0;}
.divider-text{font-size:12px;color:rgba(27,58,92,0.35);font-weight:500;}

.google-btn{
  width:100%;height:48px;
  background:white;border:1.5px solid #E2E8F0;border-radius:14px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:14px;font-weight:600;color:#1B3A5C;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,0.06);
  margin-bottom:28px;
}

.role-toggle{
  background:white;border:1.5px solid #E2E8F0;border-radius:14px;
  padding:4px;display:flex;margin-bottom:20px;
  box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.role-btn{
  flex:1;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;cursor:pointer;
  color:rgba(27,58,92,0.45);
}
.role-btn.active{background:#1B3A5C;color:white;}

.bottom-note{
  text-align:center;font-size:13px;color:rgba(27,58,92,0.45);
  padding-bottom:8px;
}
.bottom-note a{color:#2563EB;font-weight:600;}

/* Biometric */
.biometric{
  display:flex;flex-direction:column;align-items:center;
  padding:20px 0 0;gap:8px;
}
.bio-icon{
  width:52px;height:52px;border-radius:50%;
  background:rgba(37,99,235,0.08);
  display:flex;align-items:center;justify-content:center;
}
.bio-label{font-size:12px;color:#2563EB;font-weight:600;}
</style>
</head>
<body>
<div class="screen">
  <!-- Status Bar -->
  <div style="height:44px;background:#0F2744;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;flex-shrink:0;">
    <span style="color:white;font-size:13px;font-weight:700;">9:41</span>
    <div style="display:flex;gap:5px;align-items:center;">
      <svg width="16" height="10" viewBox="0 0 24 16" fill="white"><rect x="0" y="4" width="4" height="12" rx="1"/><rect x="6" y="2" width="4" height="14" rx="1"/><rect x="12" y="0" width="4" height="16" rx="1"/><rect x="18" y="0" width="5" height="16" rx="2"/></svg>
      <svg width="14" height="10" viewBox="0 0 24 16" fill="white"><path d="M12 3C8 3 4.5 5 2 8l2 2c2-2.5 4.8-4 8-4s6 1.5 8 4l2-2C19.5 5 16 3 12 3z"/><path d="M12 7c-2.5 0-4.7 1-6.3 2.7L7.5 12c1.1-1.3 2.7-2 4.5-2s3.4.7 4.5 2l1.8-2.3C16.7 8 14.5 7 12 7z"/><circle cx="12" cy="15" r="2"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0" y="0" width="21" height="11" rx="2.5" stroke="white" stroke-width="1.2" fill="none"/><rect x="1.5" y="1.5" width="16" height="8" rx="1.5" fill="white"/><path d="M22 3.5v4" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="top-hero">
    <div class="hero-circle hc1"></div>
    <div class="hero-circle hc2"></div>
    <div class="logo-row">
      <div class="logo-mark">RF</div>
      <div class="logo-text">Route<span>Flow</span></div>
    </div>
    <div class="hero-title">Welcome back,<br/>Operator 👋</div>
    <div class="hero-sub">Sign in to manage your delivery operations</div>
  </div>

  <div class="form-area">
    <!-- Role selector -->
    <div class="role-toggle" style="margin-bottom:24px;">
      <div class="role-btn active">Operator</div>
      <div class="role-btn">Driver</div>
      <div class="role-btn">Customer</div>
    </div>

    <div class="input-group">
      <label class="input-label">Username or Email</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/></svg>
        </span>
        <input class="input-field" type="text" placeholder="admin" value="admin"/>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Password</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <input class="input-field" type="password" placeholder="••••••••" value="Admin@123"/>
        <span class="input-right">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
        </span>
      </div>
    </div>

    <div class="forgot"><a href="#">Forgot password?</a></div>

    <button class="btn-primary">
      Sign In
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5l7 7-7 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="divider-row">
      <div class="divider-line"></div>
      <div class="divider-text">or continue with</div>
      <div class="divider-line"></div>
    </div>

    <div class="google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </div>

    <div class="biometric">
      <div class="bio-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 4C8.5 4 5.5 6 4 9M12 4c3.5 0 6.5 2 8 5M12 4v2M4 9c-.5 1-.7 2-.7 3M4 9l1.5 1M20 9c.5 1 .7 2 .7 3M20 9l-1.5 1M11.3 12c0-1 .7-2 1.7-2s1.7.9 1.7 2-.7 2-1.7 2-1.7-.9-1.7-2zM8 12c0-2.2 1.8-4 4-4M16 12c0 2.2-1.8 4-4 4M12 16v4M8 19c1.3.7 2.6 1 4 1s2.7-.3 4-1" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="bio-label">Use Face ID</div>
    </div>
  </div>
</div>
</body></html>

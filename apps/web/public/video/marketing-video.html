<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>RouteFlow — Product Tour</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
  body { background: var(--bg, #0a0a0a); }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>

<script type="text/babel">
const _params = new URLSearchParams(window.location.search);
const _scrollMode = _params.get('scroll') === '1';
if (_scrollMode) document.documentElement.style.setProperty('--bg', 'transparent');

function VideoRoot() {
  return (
    <div style={{ position: 'absolute', inset: 0 }}>
      <Sprite start={0}    end={5.5}>  <SceneChaos />    </Sprite>
      <Sprite start={5.5}  end={11.0}> <SceneLogo />     </Sprite>
      <Sprite start={11.0} end={17.0}> <ScenePitch />    </Sprite>
      <Sprite start={17.0} end={25.0}> <SceneOperator /> </Sprite>
      <Sprite start={25.0} end={31.0}> <SceneRoute />    </Sprite>
      <Sprite start={31.0} end={39.0}> <SceneDriver />   </Sprite>
      <Sprite start={39.0} end={47.0}> <SceneCustomer /> </Sprite>
      <Sprite start={47.0} end={54.0}> <SceneFeatures /> </Sprite>
      <Sprite start={54.0} end={60.0}> <SceneValue />    </Sprite>
      <Sprite start={60.0} end={66.0}> <SceneCTA />      </Sprite>
    </div>
  );
}

const App = () => (
  <Stage
    width={1920} height={1080} duration={66} background="#F8FAFC"
    persistKey="routeflow-marketing"
    autoplay={!_scrollMode}
    hideControls={_scrollMode}
    loop={!_scrollMode}
  >
    <VideoRoot />
  </Stage>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

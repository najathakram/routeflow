<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="40" height="40" rx="10" fill="#1B3A5C"/>
  <!-- Route connector line -->
  <path d="M13 12 C11 20 29 20 27 28" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- Origin node: white ring, blue fill -->
  <circle cx="13" cy="12" r="5" fill="white"/>
  <circle cx="13" cy="12" r="3" fill="#2563EB"/>
  <!-- Destination node: blue ring, white fill -->
  <circle cx="27" cy="28" r="5" fill="#2563EB"/>
  <circle cx="27" cy="28" r="3" fill="white"/>
</svg>

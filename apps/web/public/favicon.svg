<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Favicon — ink rounded-square container so the mark stays legible at
       16-32px against both light and dark browser tab backgrounds. Uses the
       LogoLoop's `dark` tone (cream arcs/origin + teal accent + teal-ringed
       ink destination) so the mark contrasts with the ink container. -->
  <rect width="64" height="64" rx="14" fill="#0E1F36"/>
  <path d="M 14 14 C 40 10, 56 24, 50 50" stroke="#FAF6EE" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M 14 14 C 8 40, 24 54, 50 50" stroke="#14a39f" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <circle cx="14" cy="14" r="5.5" fill="#FAF6EE"/>
  <circle cx="50" cy="50" r="5.5" fill="#0E1F36" stroke="#14a39f" stroke-width="3"/>
</svg>

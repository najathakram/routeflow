bugs:

- id: BUG-DRV2-1
  title: Driver access token not persisted to localStorage on web
  surface: web-driver
  severity: P1
  category: flow-broken
  status: 🔴 BUG-NEW
  repro: |
    1. Navigate to /login, set tenantSlug=ux-audit-1777265477001 in localStorage.
    2. Fill username=ux_driver_a, password=UxDriver@123! and click Sign in.
    3. Login POST /api/v1/auth/login returns 200, app navigates to /route.
    4. Open DevTools console and run: Object.keys(localStorage).filter(k=>k.includes('driver'))
    5. Result is [] — no rf:driver:accessToken key exists.
    6. Refresh the page → redirected to marketing home (/) — driver is logged out.
  expected: rf:driver:accessToken and rf:driver:refreshToken written to localStorage after login; session survives page refresh.
  actual: "[] — no driver token in localStorage after successful driver login. Refresh loses session."
  root_cause: |
    apps/mobile/lib/auth.ts login() calls `await storage.set(keys.accessToken, data.accessToken)` which on web maps to localStorage.setItem. However, on the Expo web bundle the `getStoredUser()` is called synchronously during initial render before the async storage.set resolves, or the Zustand persist middleware is not configured for the driver store. The token exists only in Zustand in-memory state and is not read back from storage on fresh page load.
  proposed_fix: apps/mobile/lib/auth-store.ts — ensure driverAuth Zustand slice uses `persist` middleware writing to localStorage key rf:driver:accessToken, mirroring the operator store pattern.
  evidence: "localStorage.keys()=[] after driver login; console shows [socket] storage read key=rf:driver:accessToken token=[present] immediately after login but key absent on inspect"


- id: BUG-DRV2-5
  title: getStoredUser checks operator token before driver token — operator masks driver session
  surface: web-driver
  severity: P1
  category: security
  status: 🔴 BUG-NEW
  repro: |
    1. Log in as ux_admin in one tab (writes rf:op:accessToken to localStorage).
    2. In same incognito window, log in as ux_driver_a in another tab.
    3. Both tabs share localStorage. The driver token is written to rf:driver:accessToken.
    4. getStoredUser() iterates [OP_KEYS, DRIVER_KEYS] — finds op token first.
    5. Driver tab shows operator UI (redirected to /home operator dashboard).
  expected: Driver session in driver tab operates independently; role is determined by the tab's own auth context, not shared localStorage priority.
  actual: "When both op and driver tokens coexist, getStoredUser returns operator role. Driver tab renders operator dashboard instead of driver app."
  root_cause: apps/mobile/lib/auth.ts getStoredUser() line 92 iterates [OP_KEYS, DRIVER_KEYS] — returns the first valid token found. If operator token exists in shared localStorage, it wins regardless of which role the tab is supposed to be.
  proposed_fix: apps/mobile/lib/auth.ts — pass the expected role as a parameter to getStoredUser, or use the role stored in Zustand state to determine which key to read.
  evidence: "Source: auth.ts lines 91-108 loop order; observed: driver tab redirected to /home operator dashboard after shared localStorage had rf:op:accessToken"


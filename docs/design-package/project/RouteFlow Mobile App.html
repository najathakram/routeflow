<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>RouteFlow Mobile — Reimagined</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #DEE6EF; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react" src="ios-frame.jsx"></script>
<script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
<script type="text/babel" data-presets="react" src="mobile-core.jsx"></script>
<script type="text/babel" data-presets="react" src="mobile-wholesaler.jsx"></script>
<script type="text/babel" data-presets="react" src="mobile-retailer.jsx"></script>
<script type="text/babel" data-presets="react" src="mobile-driver.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#2563EB",
  "roundness": 24,
  "celebrations": true
}/*EDITMODE-END*/;

const ACCENTS = {
  '#2563EB': { dark: '#1D4ED8', soft: '#EAF1FE' },
  '#0E9488': { dark: '#0B7A72', soft: '#E5F5F3' },
  '#E0633D': { dark: '#C24E2D', soft: '#FDEFE8' },
};

const ROLES = [
  { id: 'wh', label: 'Wholesaler', icon: 'box', who: 'Sam · Fresh Fields Wholesale' },
  { id: 'dr', label: 'Driver', icon: 'truck', who: 'Tom · in the van' },
  { id: 'rt', label: 'Shop', icon: 'bag', who: 'Maya · Harbor Cafe' },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [role, setRole] = React.useState(() => localStorage.getItem('rfm:role') || 'wh');
  const [store, dispatch] = React.useReducer(rfmReducer, initialStore);
  const [scale, setScale] = React.useState(1);

  React.useEffect(() => { localStorage.setItem('rfm:role', role); }, [role]);

  React.useEffect(() => {
    const a = ACCENTS[t.accent] || ACCENTS['#2563EB'];
    const r = document.documentElement;
    r.style.setProperty('--rfm-acc', t.accent);
    r.style.setProperty('--rfm-acc-dark', a.dark);
    r.style.setProperty('--rfm-acc-soft', a.soft);
    r.style.setProperty('--rfm-rad', t.roundness + 'px');
  }, [t.accent, t.roundness]);

  React.useEffect(() => {
    const m = () => setScale(Math.min(1, (window.innerHeight - 130) / 874, (window.innerWidth - 40) / 402));
    m();
    window.addEventListener('resize', m);
    return () => window.removeEventListener('resize', m);
  }, []);

  const cur = ROLES.find(r => r.id === role);
  const overlayRef = React.useRef(null);

  return (
    <RFMStoreCtx.Provider value={{ store, dispatch }}>
    <RFMOverlayCtx.Provider value={overlayRef}>
      <style>{rfmCss}</style>
      <div style={{
        position: 'absolute', inset: 0,
        background: 'radial-gradient(120% 100% at 50% 0%, #EAF0F8 0%, #D6DfEA 100%)',
        display: 'flex', flexDirection: 'column', alignItems: 'center',
        fontFamily: "'Inter', sans-serif",
      }}>
        {/* Role switcher */}
        <div style={{ display: 'flex', gap: 8, marginTop: 22, zIndex: 5 }}>
          {ROLES.map(r => {
            const on = r.id === role;
            return (
              <div key={r.id} className="rfm-press" onClick={() => setRole(r.id)} style={{
                display: 'flex', alignItems: 'center', gap: 8,
                padding: '11px 18px', borderRadius: 99,
                background: on ? '#16324F' : 'rgba(255,255,255,0.8)',
                color: on ? '#fff' : 'rgba(22,50,79,0.7)',
                fontWeight: 800, fontSize: 14.5,
                boxShadow: on ? '0 8px 20px rgba(22,50,79,0.3)' : '0 2px 8px rgba(22,50,79,0.08)',
                transition: 'background 200ms, color 200ms',
              }}>
                {I(r.icon, { size: 18 })}{r.label}
              </div>
            );
          })}
        </div>
        <div style={{ marginTop: 10, fontSize: 13, fontWeight: 700, color: 'rgba(22,50,79,0.45)' }}>{cur.who}</div>

        {/* Phone */}
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 0 }}>
          <div style={{ transform: `scale(${scale})`, transformOrigin: 'center' }} data-screen-label={cur.label + ' app'}>
            <IOSDevice>
              <RFMBoundary key={role}>
                {role === 'wh' && <WhApp/>}
                {role === 'rt' && <RtApp/>}
                {role === 'dr' && <DrApp/>}
              </RFMBoundary>
              <div ref={overlayRef}></div>
              <ToastLayer celebrate={t.celebrations}/>
            </IOSDevice>
          </div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Theme"/>
        <TweakColor label="Accent" value={t.accent} options={['#2563EB', '#0E9488', '#E0633D']} onChange={(v) => setTweak('accent', v)}/>
        <TweakSlider label="Roundness" value={t.roundness} min={14} max={28} unit="px" onChange={(v) => setTweak('roundness', v)}/>
        <TweakSection label="Feel"/>
        <TweakToggle label="Celebrations" value={t.celebrations} onChange={(v) => setTweak('celebrations', v)}/>
        <TweakSection label="Demo"/>
        <TweakButton label="Reset the day" onClick={() => { window.dispatchEvent(new CustomEvent('rfm-reset')); }}/>
      </TweaksPanel>
      <ResetBridge dispatch={dispatch}/>
    </RFMOverlayCtx.Provider>
    </RFMStoreCtx.Provider>
  );
}

function ResetBridge({ dispatch }) {
  React.useEffect(() => {
    const h = () => dispatch({ type: 'RESET_DAY' });
    window.addEventListener('rfm-reset', h);
    return () => window.removeEventListener('rfm-reset', h);
  }, []);
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

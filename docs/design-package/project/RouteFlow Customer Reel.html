<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>RouteFlow — Customer Reel</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; overflow: hidden; font-family: 'Inter', sans-serif; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail" data-bg-color="#FAF6EE">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#FAF6EE"/>
    <rect x="440" y="120" width="320" height="560" rx="56" fill="#1B3A5C"/>
    <rect x="460" y="140" width="280" height="520" rx="40" fill="#fff"/>
    <circle cx="600" cy="360" r="46" fill="#2563EB"/>
    <path d="M 582 360 L 595 373 L 620 348" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="490" y="450" width="220" height="14" rx="7" fill="#E2E8F0"/>
    <rect x="490" y="480" width="160" height="14" rx="7" fill="#E2E8F0"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react" src="animations.jsx"></script>
<script type="text/babel" data-presets="react" src="customer-reel-scenes.jsx"></script>

<script type="text/babel" data-presets="react">
/*
  Customer-perspective reel (cafe/shop/bar owner watching).
  Vertical 1080x1920. Warm, human voice.

  Timeline:
   0.0 to  4.8   Hook: "You're out of oat milk. Again."
   4.8 to 10.0   Meet the customer portal
  10.0 to 17.0   Reorder in two taps
  17.0 to 23.5   Track the delivery live
  23.5 to 30.0   Every invoice, one place
  30.0 to 36.0   Returns and credits, three taps
  36.0 to 41.0   Standing orders (same order every Tuesday)
  41.0 to 46.5   What you get
  46.5 to 52.0   CTA: "Ask your supplier about RouteFlow"
*/

function CustomerReelRoot() {
  const { time } = useTimeline();
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (ref.current) ref.current.setAttribute('data-screen-label', `t=${time.toFixed(1)}s`);
  }, [Math.floor(time)]);
  return (
    <div ref={ref} style={{ position: 'absolute', inset: 0 }}>
      <Sprite start={0.0}  end={4.8}>  <C_SceneHook /></Sprite>
      <Sprite start={4.8}  end={10.0}> <C_SceneMeet /></Sprite>
      <Sprite start={10.0} end={17.0}> <C_SceneReorder /></Sprite>
      <Sprite start={17.0} end={23.5}> <C_SceneTrack /></Sprite>
      <Sprite start={23.5} end={30.0}> <C_SceneInvoices /></Sprite>
      <Sprite start={30.0} end={36.0}> <C_SceneReturns /></Sprite>
      <Sprite start={36.0} end={41.0}> <C_SceneStanding /></Sprite>
      <Sprite start={41.0} end={46.5}> <C_SceneWhat /></Sprite>
      <Sprite start={46.5} end={52.0}> <C_SceneCTA /></Sprite>
    </div>
  );
}

const App = () => (
  <Stage width={1080} height={1920} duration={52} background="#FAFBFD" persistKey="routeflow-customer-reel">
    <CustomerReelRoot />
  </Stage>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
